# Offline suite + lint on every push to main and every pull request (audit F10, D34).
# Installs exactly what the README's "Setup from scratch" does — the lock files — so a
# green run also proves the documented setup still works on a clean machine.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: datascience_agent
    steps:
      # The repo root IS the `datascience_agent` package: ADK names the agent after the
      # folder, and pytest imports the tests as `datascience_agent.tests.*`. Check out
      # into a folder with that name explicitly rather than relying on the repo name.
      - uses: actions/checkout@v4
        with:
          path: datascience_agent

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            datascience_agent/requirements.lock
            datascience_agent/requirements-worker.lock

      - name: Install the agent runtime (exact pins) and the package
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps

      - name: Build the code-execution worker venv (run_python's sandbox)
        run: WORKER_BASE_PYTHON="$(command -v python)" bash scripts/bootstrap_worker.sh

      - name: Lint
        run: ruff check .

      # LLM-calling tests skip themselves without RUN_LLM_EVALS=1 + an API key.
      - name: Test
        run: python -m pytest -q
